apiVersion: v1
kind: Service
metadata:
  name: {{ include "legal-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "legal-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "legal-ai.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
